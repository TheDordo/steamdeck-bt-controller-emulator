<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The root daemon (bt-controller-emulator.service) owns the control
       name, registers GATT apps / advertisements / agents / SDP records
       with BlueZ, and answers BlueZ callbacks into those objects. -->
  <policy user="root">
    <allow own="com.steamdeck.btemu"/>
    <allow send_destination="org.bluez"/>
    <allow send_destination="org.freedesktop.DBus"/>
    <allow send_interface="org.bluez.GattManager1"/>
    <allow send_interface="org.bluez.LEAdvertisingManager1"/>
    <allow send_interface="org.bluez.AgentManager1"/>
    <allow send_interface="org.bluez.ProfileManager1"/>
    <allow send_interface="org.bluez.GattService1"/>
    <allow send_interface="org.bluez.GattCharacteristic1"/>
    <allow send_interface="org.bluez.GattDescriptor1"/>
    <allow send_interface="org.bluez.LEAdvertisement1"/>
    <allow send_interface="org.bluez.Agent1"/>
    <allow send_interface="org.bluez.Adapter1"/>
    <allow send_interface="org.bluez.Device1"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow receive_sender="org.bluez"/>
  </policy>

  <!-- Unprivileged clients (GTK4 GUI + CLI in the user session) may call
       and receive signals from the daemon. -->
  <policy context="default">
    <allow send_destination="com.steamdeck.btemu"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="com.steamdeck.btemu"/>
  </policy>
</busconfig>
